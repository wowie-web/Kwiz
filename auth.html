<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Kwiz — Sign Up or Log In</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="shared.js"></script>
</head>
<body>
  <main class="auth-wrapper">
    <section class="auth-card" aria-label="Kwiz Authentication">
      <header class="brand-header">
        <div class="brand-logo-frame">
          <img id="brandLogo" src="logo.png" alt="Kwiz Logo" />
        </div>
        <h1 class="brand-title">K<span>wiz</span></h1>
        <p class="brand-subtitle">Solo quizzes, custom packs &amp; live contests</p>
      </header>

      <div class="mode-tabs" role="tablist" aria-label="Authentication mode">
        <button type="button" id="tabLogin" class="mode-tab active" role="tab" aria-selected="true">
          Log In
        </button>
        <button type="button" id="tabSignup" class="mode-tab" role="tab" aria-selected="false">
          Sign Up
        </button>
      </div>

      <div id="statusBanner" class="status-banner" role="alert" aria-live="polite"></div>

      <!-- LOGIN FORM -->
      <form id="loginForm" class="auth-form active" novalidate>
        <div class="field-group">
          <label class="field-label" for="loginIdentifier">Full Name or User Name</label>
          <input
            id="loginIdentifier"
            name="identifier"
            type="text"
            class="input-control"
            placeholder="Enter your full name or username"
            autocomplete="username"
            required
          />
        </div>

        <div class="field-group">
          <label class="field-label" for="loginPassword">Password</label>
          <div class="input-box">
            <input
              id="loginPassword"
              name="password"
              type="password"
              class="input-control has-toggle"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            />
            <button
              type="button"
              class="eye-btn"
              data-target="loginPassword"
              aria-label="Show or hide password"
              aria-pressed="false"
            >
              <i data-lucide="eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" id="loginSubmitBtn" class="submit-btn">Log In to Kwiz</button>
      </form>

      <!-- SIGN UP FORM -->
      <form id="signupForm" class="auth-form" novalidate>
        <div class="field-group">
          <label class="field-label" for="signupFullName">Full Name</label>
          <input
            id="signupFullName"
            name="fullName"
            type="text"
            class="input-control"
            placeholder="e.g. Alex Rivera"
            autocomplete="name"
            required
          />
        </div>

        <div class="field-group">
          <label class="field-label" for="signupUsername">User Name</label>
          <input
            id="signupUsername"
            name="username"
            type="text"
            class="input-control"
            placeholder="e.g. alex_kwiz"
            autocomplete="username"
            required
          />
        </div>

        <div class="field-group">
          <label class="field-label" for="signupBirthdate">Birthdate</label>
          <input
            id="signupBirthdate"
            name="birthdate"
            type="date"
            class="input-control"
            required
          />
        </div>

        <div class="field-group">
          <label class="field-label" for="signupPassword">Password</label>
          <div class="input-box">
            <input
              id="signupPassword"
              name="password"
              type="password"
              class="input-control has-toggle"
              placeholder="At least 6 characters"
              autocomplete="new-password"
              required
            />
            <button
              type="button"
              class="eye-btn"
              data-target="signupPassword"
              aria-label="Show or hide password"
              aria-pressed="false"
            >
              <i data-lucide="eye"></i>
            </button>
          </div>
        </div>

        <div class="field-group">
          <label class="field-label" for="signupConfirmPassword">Confirm Password</label>
          <div class="input-box">
            <input
              id="signupConfirmPassword"
              name="confirmPassword"
              type="password"
              class="input-control has-toggle"
              placeholder="Re-enter your password"
              autocomplete="new-password"
              required
            />
            <button
              type="button"
              class="eye-btn"
              data-target="signupConfirmPassword"
              aria-label="Show or hide confirm password"
              aria-pressed="false"
            >
              <i data-lucide="eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" id="signupSubmitBtn" class="submit-btn">Create Account</button>
      </form>
    </section>
  </main>

  <script>
    const tabLogin = document.getElementById("tabLogin");
    const tabSignup = document.getElementById("tabSignup");
    const loginForm = document.getElementById("loginForm");
    const signupForm = document.getElementById("signupForm");
    const statusBanner = document.getElementById("statusBanner");
    const brandLogo = document.getElementById("brandLogo");

    function showStatus(message, type = "info") {
      statusBanner.textContent = message;
      statusBanner.className = `status-banner show ${type}`;
    }

    function hideStatus() {
      statusBanner.textContent = "";
      statusBanner.className = "status-banner";
    }

    function switchTab(mode) {
      playSound("tap");
      hideStatus();
      const isLogin = mode === "login";
      tabLogin.classList.toggle("active", isLogin);
      tabLogin.setAttribute("aria-selected", String(isLogin));
      tabSignup.classList.toggle("active", !isLogin);
      tabSignup.setAttribute("aria-selected", String(!isLogin));

      loginForm.classList.toggle("active", isLogin);
      signupForm.classList.toggle("active", !isLogin);
    }

    tabLogin.addEventListener("click", () => switchTab("login"));
    tabSignup.addEventListener("click", () => switchTab("signup"));

    document.querySelectorAll(".eye-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        playSound("tap");
        const input = document.getElementById(btn.dataset.target);
        if (!input) return;
        const willShow = input.type === "password";
        input.type = willShow ? "text" : "password";
        btn.setAttribute("aria-pressed", String(willShow));
        btn.innerHTML = `<i data-lucide="${willShow ? "eye-off" : "eye"}"></i>`;
        refreshLucideIcons();
      });
    });

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      playSound("tap");
      hideStatus();

      const identifier = document.getElementById("loginIdentifier").value.trim();
      const password = document.getElementById("loginPassword").value;

      if (!identifier || !password) {
        playSound("wrong");
        showStatus("Please enter your full name or username and password.", "error");
        return;
      }

      const btn = document.getElementById("loginSubmitBtn");
      btn.disabled = true;
      btn.textContent = "Checking credentials...";

      try {
        const binData = await readBin(KWIZ_CONFIG.usersBinId);
        const users = Array.isArray(binData.users) ? binData.users : [];
        const needle = identifier.toLowerCase();

        const matchedUser = users.find((u) => {
          const uname = (u.username || "").trim().toLowerCase();
          const fname = (u.fullName || "").trim().toLowerCase();
          return uname === needle || (fname && fname === needle);
        });

        if (!matchedUser) {
          playSound("wrong");
          showStatus("No account found with that full name or username.", "error");
          btn.disabled = false;
          btn.textContent = "Log In to Kwiz";
          return;
        }

        const passwordHash = await sha256Hex(password);
        if (matchedUser.passwordHash !== passwordHash) {
          playSound("wrong");
          showStatus("Incorrect password. Please try again.", "error");
          btn.disabled = false;
          btn.textContent = "Log In to Kwiz";
          return;
        }

        playSound("correct");
        setSessionUser(matchedUser);
        showStatus(`Welcome back, ${matchedUser.fullName || matchedUser.username}! Redirecting...`, "success");
        setTimeout(() => {
          window.location.href = "index.html";
        }, 500);
      } catch (err) {
        playSound("wrong");
        showStatus(`Connection error: ${err.message}`, "error");
        btn.disabled = false;
        btn.textContent = "Log In to Kwiz";
      }
    });

    signupForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      playSound("tap");
      hideStatus();

      const fullName = document.getElementById("signupFullName").value.trim();
      const username = document.getElementById("signupUsername").value.trim();
      const birthdate = document.getElementById("signupBirthdate").value;
      const password = document.getElementById("signupPassword").value;
      const confirmPassword = document.getElementById("signupConfirmPassword").value;

      if (!fullName || !username || !birthdate || !password || !confirmPassword) {
        playSound("wrong");
        showStatus("Please fill out all sign-up fields.", "error");
        return;
      }

      if (!/^[a-zA-Z0-9._-]{3,24}$/.test(username)) {
        playSound("wrong");
        showStatus("Username must be 3–24 characters (letters, numbers, ., _, -).", "error");
        return;
      }

      if (password.length < 6) {
        playSound("wrong");
        showStatus("Password must be at least 6 characters long.", "error");
        return;
      }

      if (password !== confirmPassword) {
        playSound("wrong");
        showStatus("Passwords do not match.", "error");
        return;
      }

      const btn = document.getElementById("signupSubmitBtn");
      btn.disabled = true;
      btn.textContent = "Saving to Kwiz...";

      try {
        const binData = await readBin(KWIZ_CONFIG.usersBinId);
        const users = Array.isArray(binData.users) ? binData.users : [];

        const usernameTaken = users.some(
          (u) => (u.username || "").trim().toLowerCase() === username.toLowerCase()
        );
        if (usernameTaken) {
          playSound("wrong");
          showStatus("That username is already taken. Try another one.", "error");
          btn.disabled = false;
          btn.textContent = "Create Account";
          return;
        }

        const passwordHash = await sha256Hex(password);
        const newUser = {
          id: `usr_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
          fullName,
          username,
          birthdate,
          passwordHash,
          role: username.toLowerCase() === "admin" ? "admin" : "user",
          avatar: KWIZ_CONFIG.defaultEmojiAvatar,
          bio: "",
          replayKeysUsed: 0,
          createdAt: new Date().toISOString(),
          stats: {
            quizzesPlayed: 0,
            quizzesCreated: 0,
            totalScore: 0
          },
          history: []
        };

        users.push(newUser);
        await writeBin(KWIZ_CONFIG.usersBinId, { ...binData, users });
        setSessionUser(newUser);

        playSound("win");
        showStatus("Account created and synced! Taking you to Kwiz...", "success");
        setTimeout(() => {
          window.location.href = "index.html";
        }, 600);
      } catch (err) {
        playSound("wrong");
        showStatus(`Could not save account: ${err.message}`, "error");
        btn.disabled = false;
        btn.textContent = "Create Account";
      }
    });

    refreshLucideIcons();
    applyEventBranding(brandLogo);
  </script>
</body>
</html>
